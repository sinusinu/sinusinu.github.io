<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta property="og:title" content="시누의 싸이버스페이스" />
        <meta property="og:image" content="favicon.png" />
		<link rel="icon" href="favicon.png" type="image/png"/>
		<link rel="icon" href="favicon.ico" type="image/vnd.microsoft.icon"/>
        <title>시누의 싸이버스페이스</title>
        <style>
            @font-face {
                font-family: 'ThinMulmaru';
                src: url('https://cdn.jsdelivr.net/gh/Project-Noonnu/2607161321@thinmulmaru/thinmulmaru/ThinMulmaru.woff2') format('woff2');
                font-weight: 400;
                font-display: swap;
            }
            :root {
                --color-bg: rgb(33, 33, 33);
                --color-fg: rgb(248, 248, 248);
            }
            html {
                margin: 0;
                padding: 0;
                height: 100dvh;
            }
            body {
                margin: 0;
                padding: 0;
                width: 100dvw;
                height: 100dvh;
                overflow: hidden;
                background: var(--color-bg);
                color: var(--color-fg);
                font-family: 'ThinMulmaru', monospace;
                text-align: center;
                user-select: none;
            }
            .container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-direction: column;
            }
            .texty {
                width: 100dvw;
                max-width: 300px;
                text-align: left;
                font-size: 24px;
                text-shadow: 2px 2px 0 var(--color-bg), 3px 3px 0 var(--color-bg);
                line-height: 1.2;
            }
            .lines {
                opacity: 0%;
            }
            .cursor {
                color: transparent;
                text-shadow: none;
                animation: 1s infinite step-end cursor;
            }
            @keyframes cursor {
                0% {
                    box-shadow: 2px 2px 0 var(--color-bg), 3px 3px 0 var(--color-bg);
                    background-color: var(--color-fg);
                }
                50% {
                    box-shadow: none;
                    background-color: transparent;
                }
                100% {
                    box-shadow: 2px 2px 0 var(--color-bg), 3px 3px 0 var(--color-bg);
                    background-color: var(--color-fg);
                }
            }
            .animate {
                opacity: 0%;
                animation: 1s forwards step-start pop;
            }
            .animate:nth-child( 1) { animation-delay: 0.10s; }
            .animate:nth-child( 2) { animation-delay: 0.11s; }
            .animate:nth-child( 3) { animation-delay: 0.12s; }
            .animate:nth-child( 4) { animation-delay: 0.13s; }
            .animate:nth-child( 5) { animation-delay: 0.14s; }
            .animate:nth-child( 6) { animation-delay: 0.15s; }
            .animate:nth-child( 7) { animation-delay: 0.16s; }
            .animate:nth-child( 8) { animation-delay: 0.17s; }
            .animate:nth-child( 9) { animation-delay: 0.18s; }
            .animate:nth-child(10) { animation-delay: 0.19s; }
            .animate:nth-child(11) { animation-delay: 0.20s; }
            .animate:nth-child(12) { animation-delay: 0.21s; }
            .texty a {
                color: var(--color-fg);
                text-decoration-thickness: 2px;
            }
            .fakelink {
                color: var(--color-fg);
                cursor: pointer;
                text-decoration: 2px var(--color-fg) underline;
            }
            @keyframes pop {
                from {
                    opacity: 0%;
                }
                to {
                    opacity: 100%;
                }
            }
            .backdrop-container {
                position: absolute;
                top: 0;
                left: 0;
                width: 100dvw;
                height: 100dvh;
                perspective: 100dvh;
                z-index: -1;
                overflow: hidden;
            }
            .backdrop {
                width: 150dvh;
                height: 150dvh;
                opacity: 30%;
                translate: -25dvh -30dvh;
                animation: 12s infinite linear backdrop-anim;
                image-rendering: pixelated;
            }
            @keyframes backdrop-anim {
                from {
                    transform: rotate3d(-1, 0.35, 0, 60deg) rotateZ(0deg);
                }
                to {
                    transform: rotate3d(-1, 0.35, 0, 60deg) rotateZ(360deg);
                }
            }
        </style>
    </head>
    <body>
        <div id="container" class="container">
            <div class="texty">
                <div class="lines animate"></div>
                <div class="lines animate"></div>
                <div class="lines animate"></div>
                <div class="lines animate"></div>
                <div class="lines animate"></div>
                <div class="lines animate"></div>
                <div class="lines animate"></div>
                <div class="lines animate"></div>
                <div class="lines animate"></div>
                <div class="lines animate"></div>
                <div class="lines animate"></div>
                <div class="lines animate"></div>
            </div>
        </div>
        <div class="backdrop-container">
            <img src="favicon.png" class="backdrop">
        </div>
        <script>
            const randomQuotes = [
                ["이정도면 디자인", "괜찮지 않나?"],
                ["누가 웹디자인을", "이따구로 함?"],
            ];
            var quoteIndex = Math.floor(Math.random() * randomQuotes.length);

            const lines = document.getElementsByClassName("lines");
            var page = -1;

            function nextPage() {
                page++; if (page >= 2) page = 0;
                for (var i = 0; i < 12; i++) {
                    lines[i].classList.remove("animate");
                    lines[i].offsetWidth;
                }
                if (page == 0) {
                    const randomQuote = randomQuotes[quoteIndex];
                    quoteIndex++; if (quoteIndex >= randomQuotes.length) quoteIndex = 0;
                    lines[ 0].innerHTML = '시누의';
                    lines[ 1].innerHTML = '싸이버스페이스';
                    lines[ 2].innerHTML = '© 2025-2026 sinu';
                    lines[ 3].innerHTML = '&nbsp;';
                    lines[ 4].innerHTML = randomQuote[0];
                    lines[ 5].innerHTML = randomQuote[1];
                    lines[ 6].innerHTML = '&nbsp;';
                    lines[ 7].innerHTML = '<a href="https://github.com/sinusinu/">GitHub &gt;</a>';
                    lines[ 8].innerHTML = '<a href="https://www.instagram.com/just4sinu/">Instagram &gt;</a>';
                    lines[ 9].innerHTML = '<a href="https://sinu.pe.kr/blog/">시누의 블로그 &gt;</a>';
                    lines[10].innerHTML = '&nbsp;';
                    lines[11].innerHTML = '<span class="fakelink" onclick="nextPage()">더 보기 &gt;</span><span class="cursor">–</span>';
                } else if (page == 1) {
                    lines[ 0].innerHTML = '● Android';
                    lines[ 1].innerHTML = '<a href="https://play.google.com/store/apps/details?id=com.sinu.molla">Molla 런처 &gt;</a>';
                    lines[ 2].innerHTML = '<a href="https://play.google.com/store/apps/details?id=com.sinu.pallang">팔랑 - 간단한 메모 작성 &gt;</a>';
                    lines[ 3].innerHTML = '<a href="https://play.google.com/store/apps/details?id=kr.pe.sinu.uranus">Uranus 음악 플레이어 &gt;</a>';
                    lines[ 4].innerHTML = '&nbsp;';
                    lines[ 5].innerHTML = '● Web';
                    lines[ 6].innerHTML = '<a href="https://sinu.pe.kr/sinutools/">시누의 잡동사니 도구들 &gt;</a>';
                    lines[ 7].innerHTML = '<a href="https://sinu.pe.kr/sinutoys/">시누의 장난감 상자 &gt;</a>';
                    lines[ 8].innerHTML = '&nbsp;';
                    lines[ 9].innerHTML = '&nbsp;';
                    lines[10].innerHTML = '&nbsp;';
                    lines[11].innerHTML = '<span class="fakelink" onclick="nextPage()">돌아가기 &gt;</span><span class="cursor">–</span>';
                }
                for (var i = 0; i < 12; i++) lines[i].classList.add("animate");
            }

            nextPage();
        </script>
    </body>
</html>
